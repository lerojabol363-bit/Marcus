<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8A0000">
  <title>Merry Christmas</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Helvetica, Arial, sans-serif;
      background: #8A0000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #8A0000;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #8A0000;
      isolation: isolate;
    }

    #notes,
    #lyrics {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #notes {
      pointer-events: none;
    }

    #lyrics {
      overflow: hidden;
      pointer-events: none;
    }

    .lyric-card {
      position: absolute;
      top: 0;
      display: grid;
      width: min(300px, calc(100vw - 24px));
      height: 250px;
      place-items: center;
      padding: 15px;
      background: #8A0000;
      color: #fff;
      font-size: clamp(20px, 5vw, 22px);
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      overflow-wrap: anywhere;
      will-change: transform;
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Floating Christmas lyrics">
    <canvas id="notes" aria-hidden="true"></canvas>
    <div id="lyrics" aria-live="off"></div>
  </main>

  <script>
    (() => {
      const BOX_WIDTH = 300;
      const BOX_HEIGHT = 250;
      const RISE_SPEED = 67;
      const BOTTOM_SPAWN_OFFSET = 150;
      const NOTE_SPAWN_TAIL_BUFFER = 8;
      const NOTE_MIN_SPAWN_GAP = 0.35;
      const NOTE_MAX_SPAWN_GAP = 0.9;
      const NOTE_SPEED_RANGE = [35, 95];
      const NOTE_WOBBLE_AMP_RANGE = [12, 45];
      const NOTE_WOBBLE_FREQ_RANGE = [0.8, 2.4];
      const NOTE_CHARS = ["♪", "♫", "♬", "♩"];
      const NOTE_SIZES = [16, 22, 28, 34];
      const NOTE_COLORS = ["#8A0000", "#A30000", "#B30000", "#C40000"];

      const lyrics = [
        [0, "I want one ticket out of your heavy gaze"],
        [4, "I want one ticket off of your carousel"],
        [9, "But you should know that I die slow"],
        [13, "Running through the halls of your haunted home"],
        [18, "And the toughest part is that we both know"],
        [22, "What happened to you"],
        [24, "Why you're out on your own"],
        [26, "Merry Christmas, please don't call"],
        [31, "Merry Christmas, I'm not yours at all"],
        [36, "Merry Christmas, please don't call me"],
        [41, "Please don't call me"],
        [45, "Please don't call me"],
        [49, "Please don't call me"]
      ];

      const canvas = document.querySelector("#notes");
      const context = canvas.getContext("2d");
      const lyricLayer = document.querySelector("#lyrics");
      const cards = [];
      const notes = [];
      const lastLyricTime = lyrics.length ? lyrics[lyrics.length - 1][0] : 0;
      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let nextLyricIndex = 0;
      let nextNoteSpawnTime = 0;
      let lastFrameTime = performance.now();
      const startTime = lastFrameTime;
      let currentSide = "left";

      const randomBetween = (min, max) => Math.random() * (max - min) + min;
      const choose = (items) => items[Math.floor(Math.random() * items.length)];

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      function getCardX(side) {
        const cardWidth = Math.min(BOX_WIDTH, width - 24);
        const centered = (width - cardWidth) / 2;
        const hasTwoColumns = width >= cardWidth * 2 + 60;
        const proposed = hasTwoColumns
          ? (side === "left" ? width / 2 - cardWidth - 30 : width / 2 + 30)
          : centered + (side === "left" ? -12 : 12);
        return Math.max(12, Math.min(width - cardWidth - 12, proposed));
      }

      function addLyric(text, elapsed) {
        const side = currentSide;
        currentSide = currentSide === "left" ? "right" : "left";
        const element = document.createElement("div");
        element.className = "lyric-card";
        element.style.left = `${getCardX(side)}px`;
        lyricLayer.appendChild(element);
        cards.push({
          element,
          text,
          x: getCardX(side),
          y: height - BOX_HEIGHT - BOTTOM_SPAWN_OFFSET,
          characterCount: 0,
          nextCharacterTime: elapsed
        });
      }

      function addNote(elapsed) {
        notes.push({
          char: choose(NOTE_CHARS),
          size: choose(NOTE_SIZES),
          color: choose(NOTE_COLORS),
          baseX: randomBetween(10, Math.max(10, width - 60)),
          y: height + randomBetween(0, 120),
          spawnTime: elapsed,
          phase: randomBetween(0, Math.PI * 2),
          wobbleFrequency: randomBetween(...NOTE_WOBBLE_FREQ_RANGE),
          wobbleAmplitude: randomBetween(...NOTE_WOBBLE_AMP_RANGE),
          speed: randomBetween(...NOTE_SPEED_RANGE)
        });
        nextNoteSpawnTime = elapsed + randomBetween(NOTE_MIN_SPAWN_GAP, NOTE_MAX_SPAWN_GAP);
      }

      function updateCards(elapsed, deltaTime) {
        for (const card of cards) {
          card.y -= RISE_SPEED * deltaTime;
          card.element.style.transform = `translate3d(0, ${card.y}px, 0)`;

          if (elapsed >= card.nextCharacterTime && card.characterCount <= card.text.length) {
            card.element.textContent = card.text.slice(0, card.characterCount);
            card.characterCount += 1;
            card.nextCharacterTime = elapsed + 0.1;
          }
        }

        for (let i = cards.length - 1; i >= 0; i -= 1) {
          if (cards[i].y + BOX_HEIGHT < -50) {
            cards[i].element.remove();
            cards.splice(i, 1);
          }
        }
      }

      function updateNotes(elapsed, deltaTime) {
        context.clearRect(0, 0, width, height);
        context.globalAlpha = 0.88;
        context.textAlign = "center";
        context.textBaseline = "middle";

        for (let i = notes.length - 1; i >= 0; i -= 1) {
          const note = notes[i];
          note.y -= note.speed * deltaTime;
          if (note.y < -60) {
            notes.splice(i, 1);
            continue;
          }

          const age = elapsed - note.spawnTime;
          const x = note.baseX + Math.sin(age * note.wobbleFrequency + note.phase) * note.wobbleAmplitude;
          context.font = `bold ${note.size}px Helvetica, Arial, sans-serif`;
          context.fillStyle = note.color;
          context.fillText(note.char, x, note.y);
        }

        context.globalAlpha = 1;
      }

      function tick(now) {
        const elapsed = (now - startTime) / 1000;
        const deltaTime = Math.min((now - lastFrameTime) / 1000, 0.1);
        lastFrameTime = now;

        while (nextLyricIndex < lyrics.length && lyrics[nextLyricIndex][0] <= elapsed) {
          addLyric(lyrics[nextLyricIndex][1], elapsed);
          nextLyricIndex += 1;
        }

        if (elapsed <= lastLyricTime + NOTE_SPAWN_TAIL_BUFFER && elapsed >= nextNoteSpawnTime) {
          addNote(elapsed);
        }

        updateCards(elapsed, deltaTime);
        updateNotes(elapsed, deltaTime);

        if (nextLyricIndex < lyrics.length || cards.length > 0 || notes.length > 0 ||
            elapsed <= lastLyricTime + NOTE_SPAWN_TAIL_BUFFER) {
          requestAnimationFrame(tick);
        }
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
